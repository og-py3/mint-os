# =============================================================================
# Mint OS — System Configuration
# /etc/mint-os/mint-os.conf
# =============================================================================

[system]
# Release channel: stable | beta | nightly | edge
channel = stable

# Version (set by build system)
version = rolling

# Enable adaptive performance engine
adaptive_engine = true

# Adaptive engine check interval (seconds)
adaptive_interval = 10

# Enable AI features
ai_enabled = true

# AI backend: rules | ollama | openai (requires API key)
ai_backend = rules

# Ollama model to use (if ai_backend = ollama)
ai_model = mistral

[privacy]
# Telemetry — Mint OS collects ZERO telemetry by default
# This setting is informational only — we never collect data
telemetry = false

# MAC randomization
mac_randomize = true

# DNS provider
dns_provider = cloudflare

[performance]
# Default performance profile: idle | normal | balanced | performance | gaming | battery
default_profile = balanced

# Auto-detect profile based on workload
auto_profile = true

# Gaming mode hotkey (requires Super key support)
gaming_hotkey = Super+G

# zram: compressed swap
zram_enabled = true
zram_algorithm = lz4
zram_size_percent = 50

[snapshots]
# Btrfs + Snapper automatic snapshots
snapshots_enabled = true

# Max hourly snapshots to keep
keep_hourly = 10

# Max daily snapshots
keep_daily = 7

# Max weekly snapshots
keep_weekly = 4

# Max monthly snapshots
keep_monthly = 3

# Create snapshot before updates
snapshot_before_update = true

[updates]
# Check for updates on startup
check_on_startup = true

# Auto-download updates (not auto-install)
auto_download = false

# Mirror refresh interval (days)
mirror_refresh_days = 7

[ui]
# Animation speed: 1 (slow) to 5 (fast)
animation_speed = 3

# Blur strength: 0 (none) to 10 (max)
blur_strength = 7

# Mint glow on focused windows
window_glow = true

# Dynamic wallpaper
dynamic_wallpaper = true

# Panel style: opaque | translucent | floating
panel_style = floating

[gaming]
# MangoHud enabled by default in gaming mode
mangohud = true

# MangoHud position: top-left | top-right | bottom-left | bottom-right
mangohud_position = top-left

# GameMode daemon
gamemode = true

# FPS overlay shows: fps | frametime | gpu | cpu | all
mangohud_info = fps,gpu,cpu,temp

[developer]
# Docker integration
docker_enabled = true

# Show developer tools in system tray
dev_tray = false

# Git repository scanning (for mint-dash)
git_scan = true
